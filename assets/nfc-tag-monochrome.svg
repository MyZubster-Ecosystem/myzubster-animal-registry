<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 350 350" role="img" aria-labelledby="title desc">
  <title id="title">MyZubster monochrome NFC animal registry tag</title>
